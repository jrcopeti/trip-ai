# Interactive Claude: responds to `@claude` in PR and issue comments.
#
# This is how to re-request a review (`@claude review`), ask a question about
# the diff, or ask for a change. The action checks that the commenter has write
# access before running.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history for the same reason as claude-code-review.yml: asking
          # `@claude review` or a question about why a line looks the way it
          # does needs `git log` and `git blame` to have something to read.
          # This job passes no --allowedTools, so git is already permitted here;
          # only the history was missing.
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
