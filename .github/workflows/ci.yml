# Baseline checks on every pull request and on main.
#
# `npm run lint` is deliberately absent: `next lint` was removed in Next 16 and
# the ESLint config is on the legacy format, so it fails before reading a file.
# Typecheck is the correctness gate until that is migrated.
#
# The build needs no secrets. `prisma generate` reads only the schema, and Next
# does not evaluate the "use server" API modules at build time — verified by
# building in an empty environment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A push to a PR branch cancels the run for the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # next-env.d.ts is gitignored and generated by Next; it carries the type
      # declarations for image imports (*.jpg, *.png). Without it a clean checkout
      # fails typecheck with 45 "Cannot find module '@/assets/…'" errors.
      - run: npx next typegen
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
