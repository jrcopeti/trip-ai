# Automatic Claude review, once per pull request.
#
# Runs the code-review plugin when a PR is opened, reopened, or leaves draft.
# Not on every push: re-request a review by commenting `@claude review` on the
# PR, which the claude.yml workflow handles.
#
# Authenticates with CLAUDE_CODE_OAUTH_TOKEN, a subscription token generated by
# `claude setup-token`, so reviews use the Claude plan rather than API billing.
#
# On a public repository GitHub withholds secrets from fork PRs, so this only
# runs for branches in this repository.
name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # pull-requests must be write, not read: the whole point of this job is to
      # post inline review comments. With read the run still succeeds and logs
      # "No buffered inline comments", which looks like "found nothing" rather
      # than "could not post" — see the claude.yml job, which posts fine on write.
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # This list REPLACES Claude's defaults rather than adding to them, so
          # everything the review needs must be named. Taken from the command's own
          # `allowed-tools` frontmatter in code-review@claude-code-plugins, plus:
          #   Task      - every step of that command launches a subagent
          #               ("launch a haiku agent", "launch 4 agents in parallel").
          #               Missing it was the actual failure: 4 turns, 1 denial, no
          #               review, and a green check. See run 36268652479.
          #   TodoWrite - the command opens with "create a todo list".
          #   git blame/log/show - one review agent works from git history.
          #   git rev-parse      - permalinks need a full sha.
          # Read-only: no lint or build (CI covers those), and `contents: read`
          # stops the job pushing.
          claude_args: >-
            --allowedTools
            "Task,TodoWrite,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git merge-base:*),Bash(git blame:*),Bash(git rev-parse:*)"
