# Automatic Claude review, once per pull request.
#
# Four reviewers run in parallel, one per focus, each a complete session of its
# own. None of them posts anything: each returns its findings and the list of
# files it read as structured output, and the `summary` job merges them into
# one comment. A reviewer that skips a changed file fails its job, so a green
# check means every changed file was read under every focus.
#
# Authenticates with CLAUDE_CODE_OAUTH_TOKEN, a subscription token generated by
# `claude setup-token`, so reviews use the Claude plan rather than API billing.
#
# On a public repository GitHub withholds secrets from fork PRs, so this only
# runs for branches in this repository.
#
# NO SUBAGENTS. In `-p` mode a subagent launched in the background is abandoned
# when the session ends its turn, and the run exits 0 having done nothing —
# anthropics/claude-code#73453, closed "not planned". The breadth that subagents
# would give comes from the matrix instead. `CLAUDE_CODE_DISABLE_BACKGROUND_TASKS`
# would also fix it, but serialises the agents into a ~15 minute review.

name: Claude Code Review

on:
  pull_request:
    # Not `synchronize` or `reopened`: one review per pull request. A PR opened
    # as a draft is skipped by the guard below and reviewed on ready_for_review.
    types: [opened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    strategy:
      # One reviewer failing must not cancel the others; the summary reports
      # what each one managed.
      fail-fast: false
      matrix:
        include:
          - focus: correctness
            brief: >-
              Correctness. Off-by-one errors, stale React closures, effects that
              re-run or never clean up, unhandled error and loading branches,
              race conditions, and hydration mismatches: a value that differs
              between server and client must never change what gets rendered.
          - focus: conventions
            brief: >-
              Conventions. The rules in CLAUDE.md, and docs/design-notes.md for
              anything visual: tokens are additive (changing an existing palette
              value is a bug), motion and reduced-motion rules, font wiring, the
              component inventory, and the gotchas listed there. Also structure:
              would the next engineer wince?
          - focus: tests
            brief: >-
              Tests. Behaviour that changed without a test that would catch it
              breaking, and tests that do not test what they claim. Hold them to
              the conventions in CLAUDE.md: tests beside the code, boundaries
              mocked at the module edge, the clock pinned with a local Date,
              shared fixtures over local literals, no asserting that a
              whileInView animation ran.
          - focus: security
            brief: >-
              Security. Secrets or server-only values reaching the client,
              request or form data reaching a query or a URL unvalidated, tokens
              in URLs or logs, server actions that trust their input, and unsafe
              HTML.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The coverage contract: every file the PR adds or modifies, minus
      # lockfiles and binary assets. Removed files are left out — there is
      # nothing on disk to read.
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -vE '(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$|\.(png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|mp4|webm|pdf)$' \
            > "$RUNNER_TEMP/expected.txt" || true
          echo "count=$(wc -l < "$RUNNER_TEMP/expected.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          {
            echo "list<<__FILES__"
            sed 's/^/- /' "$RUNNER_TEMP/expected.txt"
            echo "__FILES__"
          } >> "$GITHUB_OUTPUT"
          # The shape each reviewer must return. `files_reviewed` is what the
          # coverage check compares against expected.txt.
          schema=$(jq -c . <<'JSON'
          {
            "type": "object",
            "required": ["files_reviewed", "findings"],
            "properties": {
              "files_reviewed": { "type": "array", "items": { "type": "string" } },
              "findings": {
                "type": "array",
                "items": {
                  "type": "object",
                  "required": ["path", "line", "severity", "confidence", "title", "detail", "verify"],
                  "properties": {
                    "path": { "type": "string" },
                    "line": { "type": "integer", "minimum": 0 },
                    "severity": { "enum": ["high", "medium", "low"] },
                    "confidence": { "type": "integer", "minimum": 0, "maximum": 100 },
                    "title": { "type": "string" },
                    "detail": { "type": "string" },
                    "verify": { "type": "string" }
                  }
                }
              }
            }
          }
          JSON
          )
          echo "schema=$schema" >> "$GITHUB_OUTPUT"

      - id: claude
        if: steps.files.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are one of four reviewers of this pull request, each with one
            focus. Yours:

            ${{ matrix.brief }}

            Report only findings within that focus — the other three are
            covered by the other reviewers.

            Read every one of these files in full with `Read`. The checkout is
            the PR's merge commit, so the files on disk are the PR's versions.
            For a long file, page through it with `offset` until you reach the
            end. Use `gh pr diff` to see which lines the PR changed, but a large
            diff is cut off in the tool output, so it is never a substitute for
            reading the files.

            ${{ steps.files.outputs.list }}

            Read whatever else you need for context, CLAUDE.md included.

            Context that is not a finding: this app is mid-redesign. `/` and the
            shared shell use the `sorbet` system; the other routes still use the
            previous look. Both are live on purpose, so an unmigrated page
            looking unlike a migrated one is the plan, not a defect. `npm run
            lint` is broken for a known pre-existing reason and is never a
            finding. Skip formatting and style preferences.

            Only report problems this PR introduces or touches. For each one:
            the path and the line in the PR's version of the file (0 if it is
            not tied to a line), what breaks, and how you would verify it.
            Confidence is how sure you are it is a real problem, 0-100; be
            honest, because anything under 80 is dropped. Returning no findings
            is a good result when there is nothing important — never invent
            one.

            Do not post anything to the pull request. Return your result as the
            structured output, with `files_reviewed` listing exactly the paths
            above that you read in full, written as they appear in the list.

          # The allowlist does not restrict this action's Bash — `cd`, `cat`
          # and pipes all ran unprompted in #162's review — so the boundary is
          # `--disallowedTools`, which is a hard block. Subagents (see the
          # header), anything that writes, and anything that posts: the summary
          # job is the only thing that speaks on the PR.
          claude_args: >-
            --model claude-sonnet-5-5
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Agent,Task,Write,Edit,NotebookEdit,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh api:*),Bash(git push:*)"
            --json-schema '${{ steps.files.outputs.schema }}'
          # Without this the log holds only a summary — no transcript, no record
          # of which tool was denied or how the turn ended. Keep it.
          show_full_output: "true"

      # Turns this reviewer's result into review-<focus>.json for the summary,
      # and fails the job unless every expected file was read.
      #
      # The action skips, exiting 0, whenever this file differs from main's
      # copy — i.e. on every PR that edits it, which therefore never tests its
      # own change. That path sets no `conclusion` output while the step still
      # succeeds, which is how a skip is told apart from a crash.
      - name: Check coverage
        if: ${{ !cancelled() }}
        env:
          FOCUS: ${{ matrix.focus }}
          COUNT: ${{ steps.files.outputs.count }}
          OUTCOME: ${{ steps.claude.outcome }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          out="$RUNNER_TEMP/review-$FOCUS.json"
          record() { jq -n --arg focus "$FOCUS" --arg status "$1" '{focus: $focus, status: $status}' > "$out"; }

          if [ "$COUNT" = 0 ]; then
            record nothing-to-review
            echo "::notice::No reviewable files in this PR."
            exit 0
          fi
          if [ "$OUTCOME" = success ] && [ -z "$CONCLUSION" ]; then
            record skipped
            echo "::warning::The review was skipped, not run: this PR changes the review workflow, and the action only runs a workflow identical to main's. It takes effect on the next PR after merge."
            exit 0
          fi
          if [ -z "$RESULT" ] || ! jq -e '.files_reviewed and .findings' <<<"$RESULT" >/dev/null 2>&1; then
            record no-result
            echo "::error::The $FOCUS reviewer returned no structured result (step outcome: $OUTCOME). Check how the turn ended in the run log."
            exit 1
          fi

          # Paths come back as listed, or absolute, or with a leading ./.
          jq --arg focus "$FOCUS" --arg ws "$GITHUB_WORKSPACE/" \
             --rawfile expected "$RUNNER_TEMP/expected.txt" '
            (.files_reviewed | map(ltrimstr($ws) | ltrimstr("./"))) as $read
            | ($expected | split("\n") | map(select(. != ""))) as $want
            | ($want - $read) as $missing
            | {
                focus: $focus,
                status: (if ($missing | length) == 0 then "ok" else "incomplete" end),
                expected: ($want | length),
                missing: $missing,
                findings: (.findings | map(.path |= (ltrimstr($ws) | ltrimstr("./"))))
              }' <<<"$RESULT" > "$out"

          missing=$(jq -r '.missing | length' "$out")
          if [ "$missing" -gt 0 ]; then
            echo "::error::The $FOCUS reviewer did not read $missing of $COUNT changed file(s):"
            jq -r '.missing[]' "$out"
            exit 1
          fi
          echo "The $FOCUS reviewer read all $COUNT file(s) and returned $(jq '.findings | length' "$out") finding(s)."

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ matrix.focus }}
          path: ${{ runner.temp }}/review-${{ matrix.focus }}.json
          if-no-files-found: ignore
          retention-days: 7

  summary:
    needs: review
    # Runs even when a reviewer failed, so a partial review is still posted —
    # marked incomplete — rather than lost.
    if: ${{ !cancelled() && needs.review.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Write, because this job posts the comment.
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: review-*
          merge-multiple: true
          path: reviews

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shopt -s nullglob
          files=(reviews/review-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No reviewer produced a result file."
            exit 1
          fi
          if jq -se 'all(.status == "skipped")' "${files[@]}" >/dev/null; then
            echo "::warning::Every reviewer was skipped (this PR edits the review workflow); nothing to post."
            exit 0
          fi
          if jq -se 'all(.status == "nothing-to-review")' "${files[@]}" >/dev/null; then
            echo "::notice::No reviewable files; nothing to post."
            exit 0
          fi

          # Findings under 80 confidence are dropped. The same path and line
          # raised by several reviewers becomes one finding tagged with each.
          jq -sr --arg repo "$GITHUB_REPOSITORY" --arg sha "$SHA" --argjson min 80 '
            def rank: {"high": 0, "medium": 1, "low": 2}[.] // 3;
            def link: "https://github.com/\($repo)/blob/\($sha)/\(.path)" + (if .line > 0 then "#L\(.line)" else "" end);
            def where: "`\(.path)" + (if .line > 0 then ":\(.line)" else "" end) + "`";
            def cover:
              if .status == "ok" then "\(.focus) ✓ \(.expected)/\(.expected)"
              elif .status == "incomplete" then "\(.focus) ✗ \(.missing | length) of \(.expected) unread"
              elif .status == "nothing-to-review" then "\(.focus) — nothing to review"
              else "\(.focus) — \(.status)" end;

            (sort_by(.focus)) as $reviews
            | [ $reviews[] | .focus as $f | (.findings // [])[] | . + {focus: $f} ] as $all
            | [ $all[] | select(.confidence >= $min) ]
              | group_by([.path, .line])
              | map((sort_by((.severity | rank), -.confidence) | .[0]) + {focuses: (map(.focus) | unique)})
              | sort_by((.severity | rank), -.confidence) as $kept
            | ([ $all[] | select(.confidence < $min) ] | length) as $dropped
            | [ $reviews[] | select(.status != "ok" and .status != "nothing-to-review") | .focus ] as $gaps

            | "## Claude review\n\n"
            + (if ($gaps | length) > 0
               then "> [!WARNING]\n> **Incomplete review.** These reviewers did not finish: \($gaps | join(", ")). Absence of findings from them means nothing.\n\n"
               else "" end)
            + (if ($kept | length) == 0
               then "No findings at confidence ≥ \($min).\n"
               else ($kept | to_entries | map(
                      .value as $x
                      | "**\(.key + 1). [\($x.severity)] \($x.title)** — [\($x | where)](\($x | link)) · \($x.focuses | join(", ")) · confidence \($x.confidence)\n\n\($x.detail)\n\n*Verify:* \($x.verify)\n"
                    ) | join("\n"))
               end)
            + "\n---\n<sub>Coverage: \($reviews | map(cover) | join(" · ")). "
            + "\($dropped) finding(s) under confidence \($min) dropped. "
            + "Reviewed at \($sha[0:7]).</sub>\n"
          ' "${files[@]}" > review.md

          cat review.md
          gh pr comment "$PR" --body-file review.md
