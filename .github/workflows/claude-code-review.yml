# Automatic Claude review, once per pull request.
#
# Authenticates with CLAUDE_CODE_OAUTH_TOKEN, a subscription token generated by
# `claude setup-token`, so reviews use the Claude plan rather than API billing.
#
# On a public repository GitHub withholds secrets from fork PRs, so this only
# runs for branches in this repository.
#
# ---------------------------------------------------------------------------
# Why this job does the review itself instead of running the code-review plugin
#
# It used to be `/code-review:code-review --comment`, with `Agent` and `Task`
# allowed so the command could fan out to its five review agents. That shape
# produced a GREEN CHECK THAT REVIEWED NOTHING, three PRs running:
#
#   "result": "The PR status check is still running. I'll continue once it
#              reports back."
#   num_turns: 3, is_error: false, permission_denials: [], 24 seconds
#
# The command opens by delegating a gate check ("is this PR closed, a draft,
# already reviewed?") to a subagent. The main session handed that off and ended
# its turn to wait for the answer — which is correct in an interactive session,
# where the subagent finishing wakes it back up, and fatal in `-p`, where there
# is no next turn. The session exited successfully having reviewed nothing, the
# job exited 0, and the required check went green. Runs that really reviewed
# took ~5 minutes; the broken ones took 14s, 41s and 39s.
#
# So: NEVER ADD `Agent` OR `Task` BACK TO THE ALLOWLIST. Without a tool to
# delegate with, the model has to do the review inside its own turn, and the
# failure is unreachable rather than merely unlikely. The plugin install goes
# with them — it is what wanted the subagents in the first place.
#
# `fetch-depth: 1` for the same reason: the agent that was told to read git
# history is gone, and no git tool is allowed, so a full clone buys nothing.
#
# The last step is the belt to that braces: it fails the job if nothing was
# posted. Whatever goes wrong next — a prompt that ends early, a token that
# cannot comment — it shows up as a red check rather than as a green one nobody
# can distinguish from "found nothing".
# ---------------------------------------------------------------------------
name: Claude Code Review

on:
  pull_request:
    # Deliberately not `synchronize`: one review per pull request, not one per
    # push. `ready_for_review` is here because a PR opened as a draft is skipped
    # by the guard below, and `reopened` is absent so reopening cannot post a
    # second review — the old gate-check subagent that used to enforce that is
    # what broke the job.
    types: [opened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Must be write, not read: the whole point of this job is to post review
      # comments. With read the run still succeeds and logs "No buffered inline
      # comments", which looks like "found nothing" rather than "could not post".
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Anything claude[bot] posted before now belongs to an earlier run or an
      # `@claude` comment on the draft, and must not count as this run's review.
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request yourself, in this turn. List the changed
            files with `gh pr diff --name-only`, then `Read` each one — the
            checkout is the PR's merge commit, so the files on disk are the
            PR's versions. Use `gh pr diff` for the hunks, but a large diff is
            cut off in the tool output, so never treat it as the whole change.
            Pipes are not available. Read whatever files around the change you
            need for context.

            Judge it against the rules in CLAUDE.md, and against
            docs/design-notes.md for anything visual. Order of concern:

            1. Correctness — off-by-one, stale React closures, effects that
               re-run or never clean up, unhandled error branches, and hydration
               mismatches: a value that differs between server and client must
               never change what gets rendered.
            2. Security — secrets reaching the client, request data interpolated
               into a query, tokens in URLs or logs.
            3. Missing tests for behaviour that changed. Tests sit beside the
               code as `*.test.ts(x)`; boundaries are mocked at the module edge.
            4. Structure — does the next engineer wince?

            Context that is not a finding: this app is mid-redesign. `/` and the
            shared shell use the `sorbet` system; the other routes still use the
            previous look. Both are live on purpose, so an unmigrated page
            looking unlike a migrated one is the plan, not a defect. Sorbet
            tokens are additive — adding one is fine, changing an existing
            palette value is a bug. `npm run lint` is broken for a known
            pre-existing reason and is never a finding. Skip formatting.

            For each finding: point at the line, say what breaks, and say how
            you would verify it. If there is nothing important, say so in one
            line — do not invent findings.

            Post one top-level summary. Write its markdown to
            `review-summary.md` with the Write tool, then run
            `gh pr comment ${{ github.event.pull_request.number }} --body-file review-summary.md`.
            Do not pass the body with `--body` or a heredoc. Use inline comments
            only for concrete, line-anchored issues.

          # This list REPLACES the defaults, so everything the review needs must
          # be named — and nothing it does not. No git, no other shell commands.
          #
          # `Write` is there only for the summary body. Markdown full of
          # backticks cannot go through `--body "..."` (bash runs every
          # backtick span as a command), and the usual `$(cat <<'EOF' ...)`
          # workaround is denied because `cat` is not allowed — so without a
          # file, the one step that makes the review visible was the likeliest
          # to fail. The checkout is throwaway and `contents: read`, so a file
          # written there goes nowhere.
          #
          # `--disallowedTools` makes the Agent/Task ban explicit rather than a
          # side effect of leaving them off the allowlist, so it holds whatever
          # the action or the CLI starts allowing by default.
          claude_args: >-
            --allowedTools
            "Read,Write,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --disallowedTools
            "Agent,Task"
          # Without this the run logs only a summary — turn count, cost and a
          # bare permission_denials_count — with no record of what happened. It
          # is how the false-green above was eventually diagnosed; keep it.
          show_full_output: "true"

      # Runs only if the step above succeeded — that is bash's default `if`, and
      # it is what we want: a Claude step that failed has already reddened the
      # job, and a second error would only muddy it.
      #
      # Checks both comment endpoints, because a review that posted only
      # line-anchored comments and skipped the summary is still a review.
      # claude[bot] is the author on every review this repo has had (#156, #157,
      # #159), from both this workflow and claude.yml.
      #
      # One exit is legitimate: the action refuses to run when this workflow
      # file differs from main's copy ("Workflow validation failed ... identical
      # content to the version on the repository's default branch"), and exits
      # 0. That is every PR that edits this file — it is why #153-#155 and #160
      # never ran their own fix. On that path the action sets no `conclusion`
      # output, so an empty one means "skipped", reported as a warning: failing
      # would redden every workflow PR, and passing silently would hide it.
      - name: Fail if the review posted nothing
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.start.outputs.at }}
          PR: ${{ github.event.pull_request.number }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          if [ -z "$CLAUDE_CONCLUSION" ]; then
            echo "::warning::The review was skipped, not run: this PR changes the review workflow, and the action only runs a workflow identical to main's. It takes effect on the next PR after merge."
            exit 0
          fi

          # Counts claude[bot] comments created since this job started, on one
          # endpoint. Prints the count and returns 0; returns 1 if the API call
          # itself failed.
          #
          # The explicit status check matters more than it looks. gh prints its
          # error body to STDOUT, so on a bad credential `.[]` iterates
          # {message, documentation_url} and emits two lines — counted naively,
          # an auth failure reads as "two comments posted". `grep -c '^1$'`
          # counts only the sentinel jq emits per match, and a non-zero gh exit
          # is reported as "could not check", never as "checked and passed".
          # stderr is left alone: `$(...)` captures only stdout, so gh's own
          # error message lands in the log next to the warning below.
          count_new() {
            local out
            if ! out=$(gh api "repos/$GITHUB_REPOSITORY/$1" --paginate \
                 --jq ".[]|select(.user.login==\"claude[bot]\" and .created_at>=\"$SINCE\")|1"); then
              return 1
            fi
            printf '%s\n' "$out" | grep -c '^1$' || true
          }

          checked=no
          for attempt in 1 2 3; do
            if top=$(count_new "issues/$PR/comments") \
               && inline=$(count_new "pulls/$PR/comments"); then
              checked=yes
              if [ "$(( top + inline ))" -gt 0 ]; then
                echo "Review posted $top summary and $inline inline comment(s) since $SINCE."
                exit 0
              fi
            else
              checked=no
              echo "::warning::Attempt $attempt: could not read the PR's comments."
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done

          if [ "$checked" = no ]; then
            echo "::error::Could not read the PR's comments, so whether the review posted is unknown. Check the token and the pull-requests permission."
          else
            echo "::error::The review job finished without posting anything, so it did not review. Check how the turn ended in the run log - a result like \"I'll continue once it reports back\" means the session ended waiting on something."
          fi
          exit 1
