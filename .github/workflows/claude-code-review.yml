# Automatic Claude review, once per pull request.
#
# Runs Claude Code's built-in `/code-review` — the same command as running it
# locally — with `--comment`, so findings land on the PR as inline comments.
#
# Built-in, not the `code-review` plugin (`/code-review:code-review`). The plugin
# fans out to background subagents, and in `-p` mode a background subagent is
# abandoned when the session ends its turn: the run exits 0 having reviewed
# nothing (anthropics/claude-code#73453, closed "not planned"). The built-in
# command runs in the foreground under `-p` and waits for its own findings.
# Verified headless on #162 before this workflow was written: 2.5 minutes, two
# real findings.
#
# Authenticates with CLAUDE_CODE_OAUTH_TOKEN, a subscription token generated by
# `claude setup-token`, so reviews use the Claude plan rather than API billing.
#
# On a public repository GitHub withholds secrets from fork PRs, so this only
# runs for branches in this repository.

name: Claude Code Review

on:
  pull_request:
    # Not `synchronize` or `reopened`: one review per pull request. A PR opened
    # as a draft is skipped by the guard below and reviewed on ready_for_review.
    types: [opened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Write, because the review posts its findings as PR comments.
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The review reads history and compares against the base branch.
          fetch-depth: 0

      # Comments posted before now are not this run's review.
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/code-review --comment ${{ github.event.pull_request.number }}"
          # Naming the inline-comment tool is what makes the action start the
          # MCP server that posts inline comments. The disallow list is the
          # hard boundary: the review reads and comments, it never edits or
          # pushes.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,NotebookEdit,Bash(git push:*)"
          # Without this the log holds only a summary — no transcript, no record
          # of how the turn ended. Keep it.
          show_full_output: "true"

      # Makes every outcome visible instead of a green check that might mean
      # anything:
      #
      # - skipped: the action refuses to run a workflow that differs from
      #   main's copy, so every PR that edits this file skips. It exits 0 with
      #   no `conclusion` output; reported as a warning.
      # - posted: claude[bot] commented or reviewed since the job started. Pass.
      # - nothing posted: `--comment` may post nothing for a clean PR, so the
      #   session's final result is posted instead, as a comment, and the job
      #   passes. Unless the session was too short to have reviewed anything:
      #   the early-exit failure ran 14-41s, a real review of #162 took 155s,
      #   so under 60s with nothing posted fails the job.
      - name: Check the review landed
        if: ${{ !cancelled() && steps.claude.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -z "$CONCLUSION" ]; then
            echo "::warning::The review was skipped, not run: this PR changes the review workflow, and the action only runs a workflow identical to main's. It takes effect on the next PR after merge."
            exit 0
          fi

          # claude[bot] items since $SINCE on one endpoint. Fails if the API
          # call fails, so an unreadable PR is never mistaken for an empty one.
          count_new() {
            gh api "repos/$GH_REPO/$1" --paginate \
              --jq "[.[] | select(.user.login == \"claude[bot]\" and (.$2 // \"\") >= \"$SINCE\")] | length" \
              | awk '{ n += $1 } END { print n + 0 }'
          }
          total=0
          for spec in "issues/$PR/comments created_at" "pulls/$PR/comments created_at" "pulls/$PR/reviews submitted_at"; do
            set -- $spec
            n=$(count_new "$1" "$2") || {
              echo "::error::Could not read $1 on #$PR, so whether the review posted is unknown. Check the token and the pull-requests permission."
              exit 1
            }
            total=$((total + n))
          done
          if [ "$total" -gt 0 ]; then
            echo "The review posted $total comment(s) or review(s) on #$PR."
            exit 0
          fi

          result=$(jq -c '[.[] | select(.type == "result")] | last // {}' "$EXECUTION_FILE")
          text=$(jq -r '.result // ""' <<<"$result")
          ms=$(jq -r '.duration_ms // 0' <<<"$result")
          echo "Session: $((ms / 1000))s, is_error=$(jq -r '.is_error' <<<"$result")"
          echo "$text"

          if [ "$(jq -r '.is_error' <<<"$result")" = true ] || [ -z "$text" ] || [ "$ms" -lt 60000 ]; then
            echo "::error::The review posted nothing, and the session ($((ms / 1000))s) was too short or ended in an error to have reviewed the PR. Check how the turn ended in the run log."
            exit 1
          fi

          {
            echo "## Claude review"
            echo
            echo "The review finished without posting inline comments. Its result:"
            echo
            printf '%s\n' "$text"
          } > review.md
          gh pr comment "$PR" --body-file review.md
