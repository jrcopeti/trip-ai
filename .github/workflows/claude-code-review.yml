# Automatic Claude review on pull requests.
#
# This is Anthropic's documented review workflow, from
# https://code.claude.com/docs/en/github-actions#run-a-skill — the `code-review`
# plugin with `--comment`, which posts an inline comment per issue found, or one
# "No issues found" summary comment. The plugin itself skips drafts, closed
# PRs, trivial PRs and PRs Claude has already commented on, so the extra
# triggers do not produce repeat reviews. Re-request one with `@claude review`.
#
# One addition to the documented workflow: CLAUDE_CODE_DISABLE_BACKGROUND_TASKS.
# The plugin works through subagents, and under `-p` a subagent started in the
# background is abandoned when the session ends its turn — the run exits 0
# having reviewed nothing (anthropics/claude-code#73453, closed "not planned").
# That is what left this check green with no review on #160-#162. The setting
# makes every subagent run in the foreground, so the session always gets the
# results back (https://code.claude.com/docs/en/sub-agents).
#
# Authenticates with CLAUDE_CODE_OAUTH_TOKEN, a subscription token generated by
# `claude setup-token`, so reviews use the Claude plan rather than API billing.
# On a public repository GitHub withholds secrets from fork PRs, so this only
# runs for branches in this repository.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Set both here and on the step's env, so it reaches the Claude
          # process whichever way the action passes environment through.
          settings: '{"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1"}}'
          # Kept even though the plugin's own frontmatter names this tool: the
          # action starts the MCP server that posts inline comments only when
          # --allowedTools names it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # Logs the full transcript, so a run that posts nothing can be read.
          show_full_output: "true"
