# Automatic Claude review, once per pull request.
#
# Runs the code-review plugin when a PR is opened, reopened, or leaves draft.
# Not on every push: re-request a review by commenting `@claude review` on the
# PR, which the claude.yml workflow handles.
#
# Authenticates with CLAUDE_CODE_OAUTH_TOKEN, a subscription token generated by
# `claude setup-token`, so reviews use the Claude plan rather than API billing.
#
# On a public repository GitHub withholds secrets from fork PRs, so this only
# runs for branches in this repository.
name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # pull-requests must be write, not read: the whole point of this job is to
      # post inline review comments. With read the run still succeeds and logs
      # "No buffered inline comments", which looks like "found nothing" rather
      # than "could not post" — see the claude.yml job, which posts fine on write.
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action only starts the MCP server that posts inline comments when
          # this tool is named here, even though the skill also allows it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
