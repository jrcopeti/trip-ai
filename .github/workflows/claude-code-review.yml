# Automatic Claude review, once per pull request.
#
# Runs the code-review plugin when a PR is opened, reopened, or leaves draft.
# Genuinely once: a clean review leaves a summary comment, and the command declines
# any PR Claude has already commented on, so reopening will not get you a second.
# Re-request with `@claude review`, which claude.yml handles. `ready_for_review` is
# in the list because a PR opened as a draft is skipped by the guard below.
#
# Authenticates with CLAUDE_CODE_OAUTH_TOKEN, a subscription token generated by
# `claude setup-token`, so reviews use the Claude plan rather than API billing.
#
# On a public repository GitHub withholds secrets from fork PRs, so this only
# runs for branches in this repository.
name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # pull-requests must be write, not read: the whole point of this job is to
      # post inline review comments. With read the run still succeeds and logs
      # "No buffered inline comments", which looks like "found nothing" rather
      # than "could not post" — see the claude.yml job, which posts fine on write.
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # This list REPLACES Claude's defaults, so everything the review needs
          # must be named: the command's own `allowed-tools` frontmatter, the
          # subagent tool it runs every step through (`Agent`, plus the legacy
          # `Task` alias in case one CLI has only the other), TodoWrite, and the
          # right-hand side of any pipe — a Bash rule matches the whole command
          # line, so `gh pr view --comments | head` needs `head` allowed too.
          claude_args: >-
            --allowedTools
            "Agent,Task,TodoWrite,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(jq:*),Bash(wc:*)"
